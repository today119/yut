<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecdc">
<!-- ★ 아이폰 사파리는 가로로 돌리면 주소창 + 탭 줄이 화면의 3분의 1을 먹는다.
     「홈 화면에 추가」로 열면 그 껍데기가 통째로 사라진다. 그러려면 아래 줄들이 필요하다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="윷놀이">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>윷놀이</title>
<style>
/* ── TV 미러링이 목적이다. 멀리서 보므로 글씨·말이 크고 대비가 세야 한다.
      크기는 전부 vmin 기준 — 폰 세로든 TV 가로든 화면에 맞춰 같이 커진다. ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#f4ecdc;color:#2b211a;
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-weight:800;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none!important}

/* ── 설정 화면 ── */
#setup{height:100%;overflow-y:auto;padding:4vmin;display:flex;flex-direction:column;gap:2.4vmin;align-items:center}
.title{font-size:7vmin;font-weight:900;letter-spacing:-.02em;margin:1vmin 0 0}
.sub{font-size:2.4vmin;color:#a8977f;margin:0 0 1vmin}
.card{width:100%;max-width:min(96vw,150vmin);background:#fffdf8;border:.4vmin solid #ddcdb0;border-radius:3vmin;padding:3vmin}
.teams{display:flex;gap:2.4vmin;flex-wrap:wrap}
.team{flex:1 1 40vmin;background:#f9f3e7;border-radius:2.4vmin;padding:2.4vmin;border-top:1vmin solid var(--c)}
.lab{font-size:2.2vmin;color:#8a7358;margin:0 0 1vmin}
input[type=text]{width:100%;background:#fff;border:.3vmin solid #d8c6a6;border-radius:1.6vmin;
  padding:1.6vmin 2vmin;font-size:3.4vmin;font-weight:900;color:#2b211a}
input[type=text]:focus{outline:none;border-color:var(--c)}
.horses{display:flex;gap:1.2vmin;margin-top:1.6vmin}
.horses button{flex:1;padding:1.6vmin 0;border-radius:1.4vmin;background:#fff;border:.3vmin solid #d8c6a6;
  font-size:3vmin;font-weight:900;color:#9b876c}
.horses button.on{background:var(--c);border-color:#2b211a;color:#fff}
.swatch{display:flex;gap:1vmin;margin-top:1.6vmin}
.swatch button{width:5vmin;height:5vmin;border-radius:50%;border:.5vmin solid transparent}
.swatch button.on{border-color:#2b211a}
.opts{display:flex;gap:2vmin;flex-wrap:wrap;margin-top:.5vmin}
.opt{flex:1 1 34vmin;display:flex;align-items:center;justify-content:space-between;gap:1.6vmin;
  background:#f9f3e7;border-radius:2vmin;padding:2vmin 2.4vmin}
.opt b{font-size:2.6vmin}
.opt span{display:block;font-size:2vmin;color:#8a7358;font-weight:700;margin-top:.4vmin}
.toggle{flex-shrink:0;width:12vmin;height:6vmin;border-radius:3vmin;background:#cbb794;position:relative;transition:background .15s}
.toggle i{position:absolute;top:.7vmin;left:.7vmin;width:4.6vmin;height:4.6vmin;border-radius:50%;
  background:#fff;transition:transform .15s}
.toggle.on{background:#4ea65a}
.toggle.on i{transform:translateX(6vmin)}
.go{width:100%;max-width:min(96vw,150vmin);padding:3vmin;border-radius:2.4vmin;background:#d98e1f;color:#fff;
  font-size:4.4vmin;font-weight:900;box-shadow:0 1vmin 0 #9c6410}
.go:active{transform:translateY(.5vmin);box-shadow:0 .5vmin 0 #9c6410}
.row-btn{flex:1 1 34vmin;padding:2vmin;border-radius:2vmin;background:#fffdf8;border:.3vmin solid #d8c6a6;
  font-size:2.6vmin;font-weight:900}

/* ── 게임 화면 : 가로면 좌우, 세로면 위아래 ── */
#game{height:100%;display:flex;gap:2vmin;padding:2vmin}
@media (orientation:portrait){#game{flex-direction:column}}
.left{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.right{flex:0 0 44vmin;display:flex;flex-direction:column;gap:1.6vmin;min-height:0}
@media (orientation:portrait){.right{flex:0 0 auto}}

/* 점수판 — 지금 누구 차례인지가 제일 커야 한다 */
.scores{display:flex;gap:1.6vmin}
.sc{flex:1;background:#fffdf8;border-radius:2vmin;padding:1.6vmin;border:.5vmin solid #e4d7bd;opacity:.5;transition:all .2s}
.sc.turn{opacity:1;border-color:var(--c);background:#fff6e4;transform:scale(1.03)}
.sc .nm{font-size:3vmin;font-weight:900;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .st{font-size:2vmin;color:#8a7358;margin-top:.5vmin;font-weight:700;white-space:nowrap}
.sc .big{font-size:5vmin;font-weight:900;color:#2b211a}

/* 윷 결과 버튼 */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vmin}
.pad button{padding:2.2vmin 0;border-radius:1.8vmin;background:#fff;font-size:3.4vmin;font-weight:900;
  border:.3vmin solid #d8c6a6;box-shadow:0 .5vmin 0 #e0d0b2}
.pad button:active{background:#d98e1f;color:#fff;transform:translateY(.4vmin);box-shadow:none}
.pad button.back{background:#fde8e4;border-color:#e0a99c;color:#a03c28}
.roll{padding:3vmin;border-radius:2vmin;background:#d98e1f;color:#fff;font-size:4vmin;font-weight:900;width:100%}
.roll:disabled{opacity:.3}
.queue{display:flex;gap:1vmin;flex-wrap:wrap;min-height:7vmin;align-content:flex-start}
.chip{padding:1.4vmin 2.4vmin;border-radius:1.6vmin;background:#e8dcc4;color:#2b211a;font-size:3vmin;font-weight:900;
  border:.4vmin solid transparent}
.chip.on{background:#d98e1f;color:#fff;border-color:#2b211a}
.chip.back{background:#f6cfc6;color:#8a2e1c}
.msg{font-size:2.4vmin;color:#6b5540;font-weight:700;line-height:1.45;min-height:7vmin}
#moves{display:flex;flex-direction:column;gap:1.2vmin}
.mv{display:flex;align-items:center;gap:1.6vmin;padding:2vmin 2.4vmin;border-radius:2vmin;
  background:#fffdf8;border:.4vmin solid #d8c6a6;font-size:2.8vmin;font-weight:900;text-align:left}
.mv .badge{flex-shrink:0;width:6vmin;height:6vmin;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:3vmin;font-weight:900}
.mv.new{background:#e8f5ea;border-color:#4ea65a}
.mv.new .badge{background:#4ea65a}
.row{display:flex;gap:1.2vmin}
.row button{flex:1;padding:1.8vmin 0;border-radius:1.6vmin;background:#fffdf8;font-size:2.6vmin;font-weight:900;
  border:.3vmin solid #d8c6a6}
.row button:disabled{opacity:.3}

/* 윷판 */
svg{width:100%;height:100%;max-width:min(92vmin,100%);max-height:100%;display:block}
.line{stroke:#b08a54;stroke-width:.9;fill:none}
.spot{fill:#f3e8d0;stroke:#b08a54;stroke-width:.9}
.spot.big{fill:#e4d0a6;stroke:#8a6531;stroke-width:1.3}
.spot.pick{fill:#fff3cc;stroke:#2b211a;stroke-width:1.6;stroke-dasharray:2.4 1.8}
.goal{fill:none;stroke:#2b211a;stroke-width:1.6;stroke-dasharray:2.4 1.8}
.lbl{fill:#8a7358;font-size:3.4px;font-weight:900;text-anchor:middle;dominant-baseline:central}
.horse{stroke:#fff;stroke-width:1.1}
.horse.sel{stroke:#2b211a;stroke-width:2}
.hnum{font-size:4.6px;font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#fff}
.tap{fill:transparent;cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.blink{animation:pulse .85s infinite}
.horse.ghost{stroke:#2b211a;stroke-width:2;filter:drop-shadow(0 .6px 1.2px #0006)}
.horse.land{stroke:#2b211a;stroke-width:2.2}

/* 윷 던지기 — 결과만 툭 나오면 «던진 것 같지가 않다». 윷가락이 굴러야 한다. */
#throw{position:fixed;inset:0;background:#f4ecdcee;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5vmin;z-index:20}
.sticks{display:flex;gap:3.2vmin;height:40vmin;align-items:center}
.stick{width:9vmin;height:34vmin;border-radius:4.5vmin;position:relative;
  box-shadow:0 1.2vmin 2.4vmin #0003;transform-origin:50% 50%}
/* 배(평평한 면) — 밝은 속살에 가운데 선 */
.stick.flat{background:linear-gradient(100deg,#f0dcb4 0%,#e8cf9e 48%,#dcbf88 100%)}
.stick.flat::after{content:'';position:absolute;left:50%;top:14%;bottom:14%;width:.7vmin;
  transform:translateX(-50%);background:#c2a074;border-radius:1vmin;opacity:.55}
/* 등(둥근 면) — 진한 나무껍질 */
.stick.round{background:linear-gradient(100deg,#8a6531 0%,#a67c42 45%,#6f4f24 100%)}
.stick.round::after{content:'';position:absolute;left:22%;top:8%;bottom:8%;width:1.6vmin;
  background:#ffffff26;border-radius:1vmin}
/* 빽도 표시가 된 윷가락 */
.stick.mark::before{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:5vmin;font-weight:900;color:#a03c28}
.stick.round.mark::before{color:#ffffff88}
@keyframes tumble{
  0%  {transform:translateY(58vmin) rotate(0deg) scale(.65);opacity:0}
  12% {opacity:1}
  55% {transform:translateY(-16vmin) rotate(920deg) scale(1.06)}
  82% {transform:translateY(2.5vmin) rotate(1080deg) scale(.98)}
  100%{transform:translateY(0) rotate(1080deg) scale(1)}
}
.stick.roll{animation:tumble .95s cubic-bezier(.22,.9,.3,1) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.rname{font-size:16vmin;font-weight:900;color:#2b211a;letter-spacing:-.03em;animation:pop .32s both}
.rname small{display:block;font-size:3vmin;color:#8a7358;margin-top:1vmin;font-weight:800}

/* 차례 바뀜 — 공수가 바뀌는 걸 놓치면 엉뚱한 팀이 던진다. 화면을 한 번 덮어 알린다. */
#turn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:15;
  pointer-events:none;background:#f4ecdcd9}
#turn .band{width:100%;padding:6vmin 0;text-align:center;background:var(--c);
  box-shadow:0 2vmin 5vmin #0003;animation:sweep .55s cubic-bezier(.2,.9,.25,1) both}
#turn .who{font-size:11vmin;font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1.1}
#turn .sub{font-size:3.4vmin;font-weight:900;color:#ffffffcc;margin-top:1vmin}
@keyframes sweep{
  0%  {transform:translateX(-100%) skewX(-8deg);opacity:0}
  60% {transform:translateX(2%) skewX(-8deg);opacity:1}
  100%{transform:translateX(0) skewX(0);opacity:1}
}

/* 승리 */
#win{position:fixed;inset:0;background:#f4ecdcf5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3vmin;z-index:9}
#win .who{font-size:11vmin;font-weight:900;color:var(--c);text-align:center;padding:0 4vmin}
</style>
</head>
<body>

<!-- ══════════ 설정 ══════════ -->
<div id="setup">
  <h1 class="title">🎲 윷놀이</h1>
  <p class="sub">팀 이름과 말 개수를 정하세요</p>

  <div class="card">
    <div class="teams" id="teamBox"></div>
  </div>

  <div class="card">
    <div class="opts">
      <div class="opt">
        <div><b>윷 던지기</b><span id="rollModeTxt">직접 던지고 결과를 누릅니다</span></div>
        <button class="toggle" id="tgRoll"><i></i></button>
      </div>
      <div class="opt">
        <div><b>백도</b><span>뒤로 한 칸</span></div>
        <button class="toggle on" id="tgBack"><i></i></button>
      </div>
      <div class="opt">
        <div><b>효과음</b><span>윷·모, 잡기, 도착</span></div>
        <button class="toggle on" id="tgSfx"><i></i></button>
      </div>
      <div class="opt">
        <div><b>음성 안내</b><span>차례가 된 팀 이름을 불러 줍니다</span></div>
        <button class="toggle on" id="tgVoice"><i></i></button>
      </div>
    </div>
  </div>

  <div class="opts" style="width:100%;max-width:min(96vw,150vmin)">
    <button class="row-btn" id="fs">⛶ 전체화면</button>
    <button class="row-btn" id="howto">📱 홈 화면에 추가하는 법</button>
  </div>
  <div class="card" id="howtoBox" style="display:none">
    <p class="lab" style="font-size:2.4vmin;color:#2b211a;line-height:1.75">
      <b>아이폰</b> — 사파리 <b>공유 ⬆︎</b> → 목록을 내려 <b>「홈 화면에 추가」</b> → 오른쪽 위 <b>추가</b><br>
      <b>안드로이드</b> — 주소창 옆 <b>⋮</b> → <b>「앱 설치」</b> 또는 <b>「홈 화면에 추가」</b><br><br>
      그 아이콘으로 열면 <b>주소창·탭 줄이 사라지고</b> 화면을 꽉 씁니다.
    </p>
  </div>
  <button class="go" id="start">시작하기</button>
  <p class="sub" style="margin-bottom:2vmin">폰을 TV에 미러링하면 온 가족이 함께 볼 수 있습니다</p>
</div>

<!-- ══════════ 게임 ══════════ -->
<div id="game" class="hide">
  <div class="left"><svg id="board" viewBox="-6 -12 112 124"></svg></div>
  <div class="right">
    <div class="scores" id="scores"></div>
    <div class="queue" id="queue"></div>
    <div class="msg" id="msg"></div>
  <div id="moves"></div>
    <div id="rollWrap"><button class="roll" id="rollBtn">윷 던지기</button></div>
    <div class="pad" id="pad"></div>
    <div class="row">
      <button id="undo">↩ 되돌리기</button>
      <button id="pass">결과 버리기</button>
    </div>
    <div class="row">
      <button id="fs2">⛶ 전체화면</button>
      <button id="quit">처음으로</button>
    </div>
  </div>
</div>

<div id="turn" class="hide">
  <div class="band" id="turnBand">
    <div class="who" id="turnWho"></div>
    <div class="sub">차례</div>
  </div>
</div>

<div id="throw" class="hide">
  <div class="sticks" id="sticks"></div>
  <div class="rname" id="rname" style="visibility:hidden">·</div>
</div>

<div id="win" class="hide">
  <div class="who" id="winWho"></div>
  <button class="go" style="max-width:60vmin" id="again">다시 하기</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   판·경로 규칙  (scratchpad 에서 node 로 40개 테스트를 통과시킨 그 코드)
   ═══════════════════════════════════════════════════════════ */
const CELL = {};
(() => {
  const put = (id, x, y) => { CELL[id] = { id, x, y }; };
  put('o0', 90, 90); put('o5', 90, 10); put('o10', 10, 10); put('o15', 10, 90);
  for (let i = 1; i <= 4; i++) put('o' + i, 90, 90 - 16 * i);
  for (let i = 1; i <= 4; i++) put('o' + (5 + i), 90 - 16 * i, 10);
  for (let i = 1; i <= 4; i++) put('o' + (10 + i), 10, 10 + 16 * i);
  for (let i = 1; i <= 4; i++) put('o' + (15 + i), 10 + 16 * i, 90);
  put('C', 50, 50);
  put('a1', 76.67, 23.33); put('a2', 63.33, 36.67);
  put('a3', 36.67, 63.33); put('a4', 23.33, 76.67);
  put('b1', 23.33, 23.33); put('b2', 36.67, 36.67);
  put('b3', 63.33, 63.33); put('b4', 76.67, 76.67);
})();
const O = (n) => 'o' + n;
const OUTER = []; for (let i = 1; i <= 19; i++) OUTER.push(O(i)); OUTER.push('OUT');
const ROUTES = {
  outer: OUTER,
  diagA: [O(1),O(2),O(3),O(4),O(5),'a1','a2','C','a3','a4',O(15),O(16),O(17),O(18),O(19),'OUT'],
  diagB: [O(1),O(2),O(3),O(4),O(5),O(6),O(7),O(8),O(9),O(10),'b1','b2','C','b3','b4','OUT'],
  center:[O(1),O(2),O(3),O(4),O(5),'a1','a2','C','b3','b4','OUT'],
};
/* 백도로 뒤로 가면 «길 이름»이 칸과 어긋날 수 있다(예: 중앙에서 백도 → a2 인데 길은 'center' 그대로 →
   다음에 중앙을 «지나가기만» 해도 골인 쪽으로 꺾임). 칸에 맞는 길로 되돌린 뒤 모서리·중앙 규칙을 적용한다(10/16) */
function canonRoute(route, idx) {
  if (route !== 'outer' && idx <= 3) return 'outer';            // o1~o4 = 바깥길
  if (route === 'diagB' && idx <= 8) return 'outer';            // o5~o9 = 바깥길(o5면 아래에서 지름길로)
  if (route === 'center' && idx <= 6) return 'diagA';           // a1·a2·o5 = 중앙 전 → 직진 지름길
  return route;
}
function switchRoute(route, idx) {
  route = canonRoute(route, idx);
  const cell = ROUTES[route][idx];
  if (cell === O(5)  && route === 'outer') return { route: 'diagA',  idx };
  if (cell === O(10) && route === 'outer') return { route: 'diagB',  idx };
  if (cell === 'C'   && route === 'diagA') return { route: 'center', idx };
  return { route, idx };
}
const YUT = {
  BACK:{key:'BACK',name:'백도',step:-1,again:false},
  DO:  {key:'DO',  name:'도',  step:1, again:false},
  GAE: {key:'GAE', name:'개',  step:2, again:false},
  GEOL:{key:'GEOL',name:'걸',  step:3, again:false},
  YUT: {key:'YUT', name:'윷',  step:4, again:true },
  MO:  {key:'MO',  name:'모',  step:5, again:true },
};
/* 윷 네 가락을 던진다.  «평평한 면(배)이 위로» 온 개수로 정한다.
   0개=모 · 1개=도 · 2개=개 · 3개=걸 · 4개=윷.
   가락 하나(0번)에는 빽도 표시가 있어, 도일 때 그 가락이 배로 서면 백도가 된다.
   화면에 굴려 보여주려고 «각 가락의 면»도 같이 돌려준다. */
function rollYut(useBack) {
  const flats = [0,1,2,3].map(() => Math.random() < 0.6);
  const n = flats.filter(Boolean).length;
  let y;
  if (n === 0) y = YUT.MO;
  else if (n === 4) y = YUT.YUT;
  else if (n === 1) y = (useBack && flats[0]) ? (useBack ? YUT.BACK : YUT.DO) : YUT.DO;
  else y = [null, null, YUT.GAE, YUT.GEOL][n];
  if (!useBack && y === YUT.BACK) y = YUT.DO;
  return { y, flats };
}
function movePiece(pos, step) {
  if (pos.waiting) {
    if (step < 0) return null;
    return { ...switchRoute('outer', step - 1), done: false };
  }
  const idx = pos.idx + step;
  if (idx >= ROUTES[pos.route].length - 1) return { done: true };
  if (idx < -1) return null;
  if (idx === -1) return { route: 'outer', idx: -1, done: false };
  return { ...switchRoute(pos.route, idx), done: false };
}
function cellOf(pos) {
  if (pos.waiting || pos.done) return null;
  return pos.idx === -1 ? 'o0' : ROUTES[pos.route][pos.idx];
}

const COLORS = ['#4d9de0','#e05a4d','#4ea65a','#c77dd6','#e0a43c','#4dd6c8'];

/* ══ 효과음 ══
   음원 파일을 두면 단일 파일이 깨진다. 그래서 그 자리에서 «소리를 만들어» 쓴다.
   ⚠️ 아이폰은 «사람이 누른 직후»에만 소리를 낼 수 있다 → 「시작하기」에서 한 번 깨워 둔다. */
let AC = null;
function ac() {
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
  return AC;
}
/** 음 하나. slide 를 주면 그 음까지 미끄러진다(빠밤 의 「밤」). */
function tone(f, at, dur, opt) {
  const a = ac(); if (!a || !cfg.sfx) return;
  opt = opt || {};
  const t = a.currentTime + at;
  const o = a.createOscillator(), g = a.createGain();
  o.type = opt.type || 'triangle';
  o.frequency.setValueAtTime(f, t);
  if (opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, t + dur);
  const v = opt.gain == null ? 0.2 : opt.gain;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
/** 윷가락이 부딪히는 「딱」 — 짧은 잡음을 대나무처럼 걸러 낸다. */
function clack(at, gain) {
  const a = ac(); if (!a || !cfg.sfx) return;
  const t = a.currentTime + at, n = Math.floor(a.sampleRate * 0.05);
  const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
  const src = a.createBufferSource(); src.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1100 + Math.random() * 900; bp.Q.value = 3;
  const g = a.createGain(); g.gain.value = gain == null ? 0.35 : gain;
  src.connect(bp).connect(g).connect(a.destination);
  src.start(t);
}

let VA = null;
function voiceEl() { if (!VA) { VA = new Audio(); VA.preload = 'auto'; } return VA; }
/* 아이폰은 «사람이 누른 직후» 한 번 틀어 둔 <audio> 만 나중에 혼자 소리를 낸다 → 「시작하기」에서 깨운다.
   audioSession 'playback' = 무음 스위치를 무시하고 미디어 소리로 낸다(사파리 17+) → 효과음도 TV 로 간다. */
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    const a = voiceEl(); a.muted = true; a.src = VOICE.home;
    const pr = a.play(); if (pr && pr.then) pr.then(() => { if (a.muted) { a.pause(); a.muted = false; } }).catch(() => { a.muted = false; });
    else a.muted = false;
  } catch (e) {}
  ac();
}
function speak(text, key) {
  if (!cfg.voice) return;
  if (key && VOICE[key]) {
    try {
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
      const a = voiceEl(); a.pause(); a.muted = false; a.src = VOICE[key]; a.currentTime = 0;
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => {});
      return;
    } catch (e) { /* 아래 목소리로 */ }
  }
  try {
    if (VA) VA.pause();
    const S = window.speechSynthesis;
    if (!S) return;
    S.cancel();                                  // 겹쳐 읽지 않게
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 1.05; u.pitch = 1.05;
    const ko = S.getVoices().find((v) => /ko/i.test(v.lang));
    if (ko) u.voice = ko;
    S.speak(u);
  } catch (e) { /* 지원 안 하면 조용히 넘어간다 */ }
}

const SFX = {
  roll() { [0, 0.09, 0.17, 0.26, 0.36, 0.48].forEach((t, i) => clack(t, 0.3 - i * 0.03)); },
  // 윷·모 — 「빠밤!」
  fanfare() {
    tone(523, 0,    0.12, { type: 'square', gain: 0.16 });
    tone(784, 0.11, 0.42, { type: 'square', gain: 0.2 });
    tone(392, 0.11, 0.42, { type: 'triangle', gain: 0.12 });
  },
  // 잡기 — 한 방 치고 「빠바밤!」
  capture() {
    tone(160, 0,    0.14, { type: 'sawtooth', gain: 0.24, slide: 70 });
    tone(659, 0.12, 0.11, { type: 'square', gain: 0.18 });
    tone(784, 0.23, 0.11, { type: 'square', gain: 0.19 });
    tone(1047, 0.34, 0.46, { type: 'square', gain: 0.22 });
  },
  // 말이 났다
  home() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.3, { gain: 0.18 })); },
  move() { tone(660, 0, 0.07, { gain: 0.1 }); },
  // 차례가 넘어간다 — 「뿅↘︎뿅↗︎」 두 음으로 «바뀌었다»는 걸 알린다
  turn() {
    tone(587, 0,    0.13, { type: 'triangle', gain: 0.16, slide: 440 });
    tone(523, 0.14, 0.26, { type: 'triangle', gain: 0.18, slide: 698 });
  },
  win() {
    [[523,0],[523,.13],[659,.26],[784,.39],[1047,.52]].forEach(([f, t]) =>
      tone(f, t, t === 0.52 ? 0.8 : 0.16, { type: 'square', gain: 0.2 }));
    tone(392, 0.52, 0.8, { type: 'triangle', gain: 0.12 });
  },
};
const el = (id) => document.getElementById(id);

let cfg = {
  teams: [
    { name: '', horses: 4, color: COLORS[0] },
    { name: '', horses: 4, color: COLORS[1] },
  ],
  autoRoll: false,   // false = 실물 윷을 던지고 결과를 누른다
  useBack: true,
  sfx: true,
  voice: true,
};
let G = null;        // 진행 중인 판
let history = [];    // 되돌리기용 스냅샷
/* 말이 움직이는 동안(BUSY) 은 아무것도 못 누른다.
   ANIM = 판 위를 콩콩 옮겨 가는 말 {ti, idxs, cell, n} · LAND = 방금 도착한 말(테두리로 표시) */
let BUSY = false, ANIM = null, LAND = null;

/* ── 설정 화면 ── */
function drawSetup() {
  el('teamBox').innerHTML = cfg.teams.map((t, i) => `
    <div class="team" style="--c:${t.color}">
      <p class="lab">${i + 1}팀 이름</p>
      <input type="text" data-nm="${i}" value="${t.name.replace(/"/g,'&quot;')}"
             placeholder="${i === 0 ? '청팀' : '홍팀'}" maxlength="8" style="--c:${t.color}">
      <p class="lab" style="margin-top:2vmin">말 개수</p>
      <div class="horses" style="--c:${t.color}">
        ${[1,2,3,4].map(n => `<button data-h="${i}" data-n="${n}" class="${t.horses===n?'on':''}">${n}</button>`).join('')}
      </div>
      <div class="swatch">
        ${COLORS.map(c => `<button data-c="${i}" data-col="${c}" class="${t.color===c?'on':''}"
           style="background:${c}"></button>`).join('')}
      </div>
    </div>`).join('');

  el('teamBox').querySelectorAll('[data-nm]').forEach(i =>
    i.oninput = () => { cfg.teams[+i.dataset.nm].name = i.value; });
  el('teamBox').querySelectorAll('[data-h]').forEach(b =>
    b.onclick = () => { cfg.teams[+b.dataset.h].horses = +b.dataset.n; drawSetup(); });
  el('teamBox').querySelectorAll('[data-c]').forEach(b =>
    b.onclick = () => {
      const i = +b.dataset.c, col = b.dataset.col;
      if (cfg.teams[1 - i].color === col) cfg.teams[1 - i].color = cfg.teams[i].color;
      cfg.teams[i].color = col; drawSetup();
    });
}
el('tgRoll').onclick = () => {
  cfg.autoRoll = !cfg.autoRoll;
  el('tgRoll').classList.toggle('on', cfg.autoRoll);
  el('rollModeTxt').textContent = cfg.autoRoll ? '앱이 대신 던져 줍니다' : '직접 던지고 결과를 누릅니다';
};
el('tgBack').onclick = () => {
  cfg.useBack = !cfg.useBack;
  el('tgBack').classList.toggle('on', cfg.useBack);
};
el('tgSfx').onclick = () => {
  unlockAudio();
  cfg.sfx = !cfg.sfx;
  el('tgSfx').classList.toggle('on', cfg.sfx);
  if (cfg.sfx) SFX.fanfare();          // 켠 순간 어떤 소리인지 들려준다
};
el('tgVoice').onclick = () => {
  unlockAudio();
  cfg.voice = !cfg.voice;
  el('tgVoice').classList.toggle('on', cfg.voice);
  if (cfg.voice) speak('음성 안내를 켰습니다', 'on');
};

/* ── 판 시작 ── */
el('start').onclick = () => {
  unlockAudio();
  const names = cfg.teams.map((t, i) => t.name.trim() || (i === 0 ? '청팀' : '홍팀'));
  G = {
    teams: cfg.teams.map((t, i) => ({
      name: names[i], color: t.color,
      pieces: Array.from({ length: t.horses }, () => ({ waiting: true })),
    })),
    turn: 0, queue: [], throws: 1, sel: null, over: false,
  };
  history = []; BUSY = false; ANIM = null; LAND = null;
  el('setup').classList.add('hide');
  el('game').classList.remove('hide');
  el('win').classList.add('hide');
  el('turn').classList.add('hide');
  ac();                       // ★ 아이폰은 «누른 직후»에만 소리를 깨울 수 있다
  keepAwake(true);
  render();
  showTurn();
};
el('quit').onclick = () => {
  el('game').classList.add('hide'); el('win').classList.add('hide');
  el('setup').classList.remove('hide');
  keepAwake(false);
};
el('again').onclick = () => el('start').onclick();

/* ── 말 묶음: 같은 칸에 선 우리 말은 «업힌» 것으로 함께 움직인다 ── */
function groupsOf(ti) {
  const m = new Map();
  G.teams[ti].pieces.forEach((p, pi) => {
    if (p.done) return;
    const key = p.waiting ? 'W' : cellOf(p);
    if (p.waiting) { m.set('W' + pi, { key: 'W', idxs: [pi], pos: p }); return; }
    if (!m.has(key)) m.set(key, { key, idxs: [], pos: p });
    m.get(key).idxs.push(pi);
  });
  return [...m.values()];
}
/* 지금 결과로 움직일 수 있는 무리들 */
function movable(step) {
  const out = [];
  groupsOf(G.turn).forEach(g => {
    if (g.pos.waiting && step < 0) return;           // 대기 말은 백도 불가
    const dest = movePiece(g.pos, step);
    if (!dest) return;
    if (g.pos.waiting && out.some(o => o.pos.waiting)) return;  // 대기 말은 하나만 보여준다
    out.push({ ...g, dest });
  });
  return out;
}

/* ── 그리기 ── */
function drawBoard() {
  const L = (a, b) => `<line class="line" x1="${CELL[a].x}" y1="${CELL[a].y}" x2="${CELL[b].x}" y2="${CELL[b].y}"/>`;
  let s = L('o0','o5') + L('o5','o10') + L('o10','o15') + L('o15','o0') + L('o5','o15') + L('o10','o0');

  const step = G.queue[G.sel ?? -1]?.step;
  const moves = (G.sel != null && !BUSY) ? movable(step) : [];
  const destCells = new Set(moves.map(m => m.dest.done ? 'OUT' : cellOf(m.dest)));

  Object.values(CELL).forEach(c => {
    const big = ['o0','o5','o10','o15','C'].includes(c.id);
    const pick = destCells.has(c.id);
    s += `<circle class="spot ${big?'big':''} ${pick?'pick blink':''}" cx="${c.x}" cy="${c.y}" r="${big?7:4.6}"/>`;
  });
  s += `<text class="lbl" x="${CELL.o0.x}" y="${CELL.o0.y+12.5}">출발·도착</text>`;

  // 대기 말 — 판 «바깥» 에 팀별로 줄 세운다. 몇 개 남았는지 한눈에 보여야 한다.
  G.teams.forEach((t, ti) => {
    const wait = t.pieces.filter((p, pi) => p.waiting && !(ANIM && ANIM.ti === ti && ANIM.idxs.includes(pi))).length;
    const y = ti === 0 ? -3.5 : 104;
    for (let i = 0; i < wait; i++) {
      const sel = (G.sel != null) && ti === G.turn && moves.some(m => m.pos.waiting);
      s += `<circle class="horse ${sel ? 'sel blink' : ''}" cx="${6 + i * 11}" cy="${y}" r="4.4" fill="${t.color}"/>`;
    }
    if (wait) s += `<text class="lbl" x="${6 + wait * 11 + 4}" y="${y}" style="text-anchor:start">대기</text>`;
  });

  // 도착 지점 표시 — 「이 결과로 날 수 있다」를 눈에 보이게
  if (destCells.has('OUT')) {
    s += `<circle class="goal blink" cx="${CELL.o0.x}" cy="${CELL.o0.y}" r="10.5"/>`;
    s += `<text class="lbl" x="${CELL.o0.x}" y="${CELL.o0.y+12.5}" style="fill:#2b211a">🎉 난다!</text>`;
  }

  // 말
  G.teams.forEach((t, ti) => {
    groupsOf(ti).forEach(g => {
      if (g.pos.waiting) return;
      if (ANIM && ANIM.ti === ti && g.idxs.some(i => ANIM.idxs.includes(i))) return;
      const c = CELL[cellOf(g.pos)];
      const off = ti === 0 ? -2.6 : 2.6;
      const mi = (ti === G.turn) ? moves.findIndex(m => m.key === g.key) : -1;
      const sel = mi >= 0;
      const land = LAND && LAND.ti === ti && g.idxs.some(i => LAND.idxs.includes(i));
      s += `<circle class="horse ${sel?'sel blink':''} ${land?'land blink':''}" cx="${c.x+off}" cy="${c.y-2.6}" r="5.2" fill="${t.color}"/>`;
      if (g.idxs.length > 1) s += `<text class="hnum" x="${c.x+off}" y="${c.y-2.6}">${g.idxs.length}</text>`;
      // 오른쪽 버튼과 같은 번호를 말 옆에 붙여 «어느 버튼이 어느 말인지» 알 수 있게 한다
      if (sel) {
        s += `<circle cx="${c.x+off+5.4}" cy="${c.y-8}" r="3.8" fill="#2b211a"/>`;
        s += `<text x="${c.x+off+5.4}" y="${c.y-8}" class="hnum" style="font-size:4px">${mi + 1}</text>`;
      }
    });
  });

  // 옮겨 가는 중인 말
  if (ANIM) {
    const c = CELL[ANIM.cell], off = ANIM.ti === 0 ? -2.6 : 2.6;
    s += `<circle class="horse ghost" cx="${c.x+off}" cy="${c.y-4.2}" r="6" fill="${G.teams[ANIM.ti].color}"/>`;
    if (ANIM.n > 1) s += `<text class="hnum" x="${c.x+off}" y="${c.y-4.2}">${ANIM.n}</text>`;
  }

  // 누를 수 있는 넓은 영역 (작은 말은 손가락으로 못 맞춘다)
  moves.forEach(m => {
    if (m.pos.waiting) return;
    const c = CELL[cellOf(m.pos)];
    s += `<circle class="tap" cx="${c.x}" cy="${c.y}" r="10" data-mv="${m.key}"/>`;
  });
  el('board').innerHTML = s;
  el('board').querySelectorAll('[data-mv]').forEach(n =>
    n.onclick = () => doMove(moves.find(m => m.key === n.dataset.mv)));
}

function render() {
  if (G.over) return;
  const t = G.teams[G.turn];

  el('scores').innerHTML = G.teams.map((x, i) => {
    const done = x.pieces.filter(p => p.done).length;
    const wait = x.pieces.filter(p => p.waiting).length;
    return `<div class="sc ${i===G.turn?'turn':''}" style="--c:${x.color}">
      <div class="nm">${x.name}</div>
      <div class="st" style="margin:0">난 말</div>
      <div class="big">${done}<span style="font-size:2.6vmin;color:#a8977f"> / ${x.pieces.length}</span></div>
      <div class="st">🐴 대기 ${wait} · 판 위 ${x.pieces.length-done-wait}</div></div>`;
  }).join('');

  el('queue').innerHTML = G.queue.map((y, i) =>
    `<button class="chip ${y.key==='BACK'?'back':''} ${i===G.sel?'on':''}" data-q="${i}">${y.name}</button>`).join('')
    || `<span style="font-size:2.2vmin;color:#9b876c;font-weight:700">아직 던진 결과가 없습니다</span>`;
  el('queue').querySelectorAll('[data-q]').forEach(b =>
    b.onclick = () => { if (BUSY) return; G.sel = +b.dataset.q; render(); });

  // 던지기 UI — 설정에 따라 한쪽만 보인다
  el('rollWrap').classList.toggle('hide', !cfg.autoRoll);
  el('pad').classList.toggle('hide', cfg.autoRoll);
  el('rollBtn').disabled = G.throws <= 0 || BUSY;
  const keys = (cfg.useBack ? ['BACK'] : []).concat(['DO','GAE','GEOL','YUT','MO']);
  el('pad').innerHTML = keys.map(k =>
    `<button data-y="${k}" class="${k==='BACK'?'back':''}" ${G.throws<=0||BUSY?'disabled':''}>${YUT[k].name}</button>`).join('');
  el('pad').querySelectorAll('[data-y]').forEach(b => b.onclick = () => addResult(YUT[b.dataset.y]));

  // 안내 문구
  let msg = '';
  if (BUSY) msg = LAND ? LAND.msg : `<b style="color:${t.color}">${t.name}</b> 말이 움직이는 중…`;
  else if (G.throws > 0) msg = `<b style="color:${t.color}">${t.name}</b> 차례 — 윷을 던지세요` +
                          (G.throws > 1 ? ` <span style="color:#e0a43c">(${G.throws}번 남음)</span>` : '');
  else if (!G.queue.length) msg = '결과를 다 썼습니다';
  else if (G.sel == null) msg = '쓸 결과를 고르세요';
  else {
    const mv = movable(G.queue[G.sel].step);
    msg = mv.length ? `<b>${G.queue[G.sel].name}</b> — 움직일 말을 판에서 누르세요`
                    : `<b>${G.queue[G.sel].name}</b> 로 움직일 말이 없습니다 → 「결과 버리기」`;
  }
  el('msg').innerHTML = msg;

  /* ── 옮길 말 버튼 ──
     판의 말을 손가락으로 정확히 찍기가 어렵다(특히 폰 세로 화면).
     그래서 «움직일 수 있는 말마다 버튼»을 만들고, 말 옆에 같은 번호를 붙인다.
     판을 눌러도 되고 버튼을 눌러도 된다. */
  const mv = (G.sel != null && !BUSY) ? movable(G.queue[G.sel].step) : [];
  el('moves').innerHTML = mv.map((m, i) => {
    const isNew = m.pos.waiting;
    const dest = m.dest.done ? '🎉 도착(난다)' : null;
    const label = isNew
      ? `새 말 출발 · 대기 ${t.pieces.filter(p => p.waiting).length}`
      : (m.idxs.length > 1 ? `업힌 말 ${m.idxs.length}개 옮기기` : '판 위의 말 옮기기');
    return `<button class="mv ${isNew ? 'new' : ''}" data-mvbtn="${i}">
        <span class="badge" style="background:${isNew ? '#4ea65a' : t.color}">${isNew ? '🐴' : i + 1}</span>
        <span>${label}${dest ? ` <b style="color:#d98e1f">${dest}</b>` : ''}</span>
      </button>`;
  }).join('');
  el('moves').querySelectorAll('[data-mvbtn]').forEach((b) =>
    b.onclick = () => doMove(mv[+b.dataset.mvbtn]));

  el('undo').disabled = !history.length || BUSY;
  el('pass').disabled = BUSY || G.sel == null || movable(G.queue[G.sel].step).length > 0;
  drawBoard();
}

/* ── 조작 ── */
function snap() {
  history.push(JSON.stringify({ G, }));
  if (history.length > 40) history.shift();
}
el('undo').onclick = () => {
  if (!history.length || BUSY) return;
  G = JSON.parse(history.pop()).G;
  el('win').classList.add('hide');
  el('turn').classList.add('hide');
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  render();
};
/* ── 던지는 연출 ──
   결과만 툭 나오면 「던졌다」는 느낌이 없다.  네 가락이 실제로 구르고,
   멈춘 뒤에 이름이 뜬다.  아무 데나 누르면 건너뛴다(계속 던질 땐 성가시므로). */
function showThrow(flats, y, done) {
  const box = el('throw'), name = el('rname');
  el('sticks').innerHTML = flats.map((flat, i) =>
    `<div class="stick ${flat ? 'flat' : 'round'} ${i === 0 ? 'mark' : ''} roll"
          style="animation-delay:${i * 0.07}s"></div>`).join('');
  name.style.visibility = 'hidden';
  box.classList.remove('hide');
  SFX.roll();

  let ended = false;
  const finish = () => {
    if (ended) return;
    ended = true;
    box.classList.add('hide');
    box.onclick = null;
    done();
  };
  // 가락이 멈추면 이름을 띄우고, 잠깐 보여준 뒤 넘어간다
  const t1 = setTimeout(() => {
    name.innerHTML = y.name + (y.again ? '<small>한 번 더 던지세요!</small>'
                                       : (y.key === 'BACK' ? '<small>뒤로 한 칸</small>' : ''));
    name.style.animation = 'none'; name.offsetHeight; name.style.animation = '';
    name.style.visibility = 'visible';
    if (y.again) { SFX.fanfare(); speak(y.name + '! 한 번 더', y.key); }
    else { SFX.move(); speak(y.name, y.key); }
  }, 900);
  const t2 = setTimeout(finish, y.again ? 2000 : 1750);
  box.onclick = () => { clearTimeout(t1); clearTimeout(t2); finish(); };
}

el('rollBtn').onclick = () => {
  if (G.throws <= 0) return;
  const { y, flats } = rollYut(cfg.useBack);
  el('rollBtn').disabled = true;
  showThrow(flats, y, () => addResult(y));
};
el('pass').onclick = () => { snap(); G.queue.splice(G.sel, 1); G.sel = null; endIfDone(); render(); };

function addResult(y) {
  if (G.throws <= 0) return;
  if (!cfg.autoRoll) {                 // 실물로 던진 경우 — 여기서 소리를 낸다
    if (y.again) { SFX.fanfare(); speak(y.name + '! 한 번 더', y.key); }
    else SFX.move();
  }
  snap();
  G.throws -= 1;
  G.queue.push({ key: y.key, name: y.name, step: y.step });
  if (y.again) G.throws += 1;
  if (G.sel == null) G.sel = G.queue.length - 1;
  render();
}

/* 말 옮기기 — ① 한 칸씩 콩콩 옮겨 가고 ② 도착해서 잡기·나기 결과를 보여 준 뒤
   ③ 잠깐 쉬고 나서야 차례를 넘긴다.  (이동이 보이기도 전에 차례가 바뀌면 무슨 일이 났는지 모른다) */
function pathOf(pos, step) {
  if (step < 0) return [pos.idx - 1 < 0 ? 'o0' : ROUTES[pos.route][pos.idx - 1]];
  const route = pos.waiting ? 'outer' : pos.route, from = pos.waiting ? -1 : pos.idx;
  const cells = [];
  for (let i = from + 1; i <= from + step; i++) {
    const c = ROUTES[route][Math.min(i, ROUTES[route].length - 1)];
    cells.push(c === 'OUT' ? 'o0' : c);
    if (c === 'OUT') break;
  }
  return cells;
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));

async function doMove(m) {
  if (!m || BUSY) return;
  snap();
  BUSY = true;
  const g0 = G;                       // 도중에 새 판을 시작하면 여기서 멈춘다
  const ti = G.turn, me = G.teams[ti];
  const dest = m.dest;
  const step = G.queue[G.sel].step;

  // ① 콩콩 — 한 칸에 0.22초
  const cells = pathOf(m.pos, step);
  ANIM = { ti, idxs: m.idxs, cell: cells[0], n: m.idxs.length };
  for (const c of cells) {
    ANIM.cell = c; SFX.move(); render();
    await wait(220);
    if (G !== g0) return;
  }
  ANIM = null;

  // ② 도착 — 판에 반영하고 결과를 알린다
  m.idxs.forEach(i => { me.pieces[i] = dest.done ? { done: true } : { ...dest }; });
  let again = false, msg = `<b style="color:${me.color}">${me.name}</b> ${G.queue[G.sel].name} 이동 완료`;
  if (!dest.done) {
    // 잡기 — 도착 칸에 상대 말이 있으면 대기로 돌려보내고 한 번 더
    const other = G.teams[1 - ti];
    const here = cellOf(dest);
    const hit = other.pieces.filter(p => !p.done && !p.waiting && cellOf(p) === here);
    if (hit.length) {
      hit.forEach(p => { p.waiting = true; delete p.route; delete p.idx; });
      again = true;
      msg = `<b style="color:${me.color}">${me.name}</b> 💥 ${other.name} 말 ${hit.length}개를 잡았다! 한 번 더`;
      SFX.capture();
      speak(me.name + ', ' + other.name + ' 말 ' + hit.length + '개를 잡았습니다! 한 번 더', 'catch');
    }
  } else {
    msg = `<b style="color:${me.color}">${me.name}</b> 🎉 말이 났습니다!`;
    SFX.home();
    speak('났습니다!', 'home');
  }

  G.queue.splice(G.sel, 1);
  G.sel = G.queue.length ? 0 : null;
  if (again) G.throws += 1;

  const won = me.pieces.every(p => p.done);
  const turnEnds = !won && G.throws <= 0 && !G.queue.length;
  if (turnEnds) msg += ` <span style="color:#9b876c">· 곧 ${G.teams[1 - ti].name} 차례</span>`;
  LAND = { ti, idxs: m.idxs, msg };
  render();

  // ③ 결과를 볼 시간 — 차례가 바뀌거나 이기는 경우만 오래 쉰다
  await wait(won ? 1400 : turnEnds ? (again || dest.done ? 2000 : 1500) : (again || dest.done ? 1000 : 300));
  if (G !== g0) return;
  BUSY = false; LAND = null;
  if (won) { G.over = true; showWin(me); return; }
  endIfDone();
  render();
}

function endIfDone() {
  if (G.throws <= 0 && !G.queue.length) {   // 턴 종료
    G.turn = 1 - G.turn; G.throws = 1; G.sel = null;
    showTurn();
  }
}

/* 공수가 바뀌는 걸 놓치면 엉뚱한 팀이 던진다. 화면·소리·목소리 셋으로 알린다. */
let turnTimer = null;
function showTurn() {
  const t = G.teams[G.turn];
  const box = el('turn'), band = el('turnBand');
  el('turnWho').textContent = t.name;
  band.style.setProperty('--c', t.color);
  band.style.animation = 'none'; band.offsetHeight; band.style.animation = '';
  box.classList.remove('hide');
  SFX.turn();
  speak(t.name + ' 차례입니다', 'turn_' + t.name);
  clearTimeout(turnTimer);
  turnTimer = setTimeout(() => box.classList.add('hide'), 1500);
}

function showWin(team) {
  SFX.win();
  speak(team.name + ' 승리!', 'win_' + team.name);
  el('winWho').style.setProperty('--c', team.color);
  el('winWho').innerHTML = `🎉<br>${team.name} 승리!`;
  el('win').classList.remove('hide');
}

/* ── 전체화면 ──
   ⚠️ 아이폰 사파리는 웹페이지 전체화면(Fullscreen API)을 «지원하지 않는다».
      아이폰에서 주소창·탭 줄을 없애는 길은 「홈 화면에 추가」뿐이라,
      거기선 버튼을 숨기고 안내를 대신 띄운다. 안드로이드·PC 는 버튼이 바로 먹는다. */
var canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
var standalone = window.navigator.standalone === true ||
                 window.matchMedia('(display-mode: fullscreen)').matches ||
                 window.matchMedia('(display-mode: standalone)').matches;
function toggleFS() {
  var d = document, e = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (e.requestFullscreen || e.webkitRequestFullscreen).call(e);
}
['fs', 'fs2'].forEach(function (id) {
  var b = el(id);
  if (!b) return;
  if (canFS && !standalone) b.onclick = toggleFS;
  else b.classList.add('hide');
});
if (standalone) { var hb = el('howto'); if (hb) hb.classList.add('hide'); }
el('howto').onclick = function () {
  var box = el('howtoBox');
  box.style.display = box.style.display === 'none' ? '' : 'none';
};

/* ── 화면이 꺼지면 빔·TV 도 같이 꺼진다. 게임 중에는 잠기지 않게 붙잡는다.
      기기가 지원하지 않으면 조용히 넘어간다(그땐 「자동 잠금 안 함」으로). ── */
var wake = null;
function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
    } else if (!on && wake) { wake.release(); wake = null; }
  } catch (e) { /* 무시 */ }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !el('game').classList.contains('hide')) keepAwake(true);
});

drawSetup();
</script>
</body>
